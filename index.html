<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rico Snack | Vending Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --logo-blue: #0A1F44;
            --logo-orange: #FF8A00;
            --logo-yellow: #FFD600;
            --white: #FFFFFF;
            --whatsapp-green: #25D366;
            --facebook-blue: #1877F2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--white); overflow-x: hidden; }

        /* --- NAVEGACIÓN (Iconos) --- */
        nav {
            padding: 25px 8%;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            position: absolute;
            width: 100%;
            z-index: 100;
        }

        .social-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-circle.whatsapp { background-color: var(--whatsapp-green); }
        .social-circle.facebook { background-color: var(--facebook-blue); }

        .social-circle:hover { transform: translateY(-5px) scale(1.1); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .social-circle:active { transform: scale(0.9); opacity: 0.7; }

        /* --- HERO SECTION --- */
        .hero {
            background: var(--logo-blue);
            margin-top: 120px; /* Más espacio para el logo gigante */
            padding: 80px 8% 120px 8%;
            display: flex;
            align-items: center;
            position: relative;
            min-height: 550px;
        }

        .hero-content { flex: 1; z-index: 10; position: relative; }

        /* LOGO GIGANTE SOBRESALIENDO */
        .main-logo {
            width: 420px; /* Aumentado de 350px */
            height: auto;
            position: absolute;
            top: -180px; /* Más afuera */
            left: -20px;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3));
        }

        .hero-text-box { margin-top: 120px; }
        .hero h1 { font-family: 'Montserrat'; font-size: 4rem; color: white; line-height: 1.1; margin-bottom: 25px; }
        .hero h1 span { color: var(--logo-yellow); }
        .hero p { color: white; font-size: 1.3rem; opacity: 0.9; margin-bottom: 45px; max-width: 550px; }

        /* MÁQUINA GIGANTE SOBRESALIENDO */
        .hero-image { flex: 1; position: relative; height: 100%; }
        
        .vending-machine {
            width: 680px; /* Tamaño masivo para que destaque */
            height: auto;
            position: absolute;
            top: -180px; /* La saca de la caja azul hacia arriba */
            right: -80px; /* La saca hacia la derecha */
            z-index: 20;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5));
        }

        .btn-main {
            display: inline-block;
            background: var(--logo-yellow);
            color: var(--logo-blue);
            padding: 20px 40px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 800;
            font-family: 'Montserrat';
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(255, 214, 0, 0.3);
            transition: 0.3s;
        }
        
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 214, 0, 0.4); }

        .legal-footer { padding: 60px 8%; background: var(--white); color: #888; text-align: center; font-size: 0.85rem; }

        /* Ajustes para Pantallas Medianas y Móviles */
        @media (max-width: 1200px) {
            .vending-machine { width: 500px; right: -40px; }
            .hero h1 { font-size: 3rem; }
        }

        @media (max-width: 1024px) {
            .hero { flex-direction: column; text-align: center; margin-top: 180px; padding-bottom: 450px; }
            .main-logo { left: 50%; transform: translateX(-50%); width: 320px; top: -160px; }
            .vending-machine { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; }
            .hero-text-box { margin-top: 100px; }
            nav { justify-content: center; top: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="https://wa.me/528114902533" class="social-circle whatsapp" target="_blank" title="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://www.facebook.com/profile.php?id=61587850499282" class="social-circle facebook" target="_blank" title="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </a>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <img src="logo.png" alt="Rico Snack Logo" class="main-logo">
            
            <div class="hero-text-box">
                <h1>El <span>Sabor</span> que tu Empresa Merece</h1>
                <p>Soluciones de vending premium en Monterrey con tecnología sin contacto y un catálogo curado de snacks que mantienen a tu equipo motivado.</p>
                <a href="https://wa.me/528114902533" class="btn-main" target="_blank">Agenda una Demostración</a>
            </div>
        </div>

        <div class="hero-image">
            <img src="vending.png" alt="Máquina Vending Rico Snack" class="vending-machine">
        </div>
    </section>

    <footer class="legal-footer">
        <p>&copy; 2026 RICO SNACK - VENDING SOLUTIONS</p>
        <p style="margin-top:15px; opacity:0.7;">Operado legalmente por: [TU NOMBRE COMPLETO]</p>
    </footer>

</body>
</html>
