<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rico Snack | Vending Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --logo-blue: #0A1F44;
            --logo-orange: #FF8A00;
            --logo-yellow: #FFD600;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--white); overflow-x: hidden; }

        /* --- NAVEGACIÓN (Solo botón) --- */
        nav {
            padding: 20px 8%;
            display: flex;
            justify-content: flex-end; /* Logo eliminado de aquí */
            position: absolute;
            width: 100%;
            z-index: 100;
        }

        .btn-nav {
            background: var(--logo-orange);
            color: white;
            padding: 12px 35px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            font-family: 'Montserrat';
            box-shadow: 0 4px 15px rgba(255, 138, 0, 0.3);
        }

        /* --- HERO SECTION --- */
        .hero {
            background: var(--logo-blue);
            margin-top: 80px; /* Espacio para que el logo sobresalga hacia arriba */
            padding: 60px 8% 100px 8%;
            display: flex;
            align-items: center;
            position: relative;
            min-height: 500px;
        }

        .hero-content { 
            flex: 1.2; 
            z-index: 10; 
            position: relative;
        }

        /* LOGO GRANDE SOBRESALIENDO */
        .main-logo {
            width: 350px; /* Tamaño grande */
            height: auto;
            position: absolute;
            top: -140px; /* Lo saca de la franja azul hacia arriba */
            left: 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }

        .hero-text-box { margin-top: 100px; } /* Espacio para no chocar con el logo */

        .hero h1 { 
            font-family: 'Montserrat'; 
            font-size: 3.5rem; 
            color: white; 
            line-height: 1.1; 
            margin-bottom: 20px; 
        }
        .hero h1 span { color: var(--logo-yellow); }
        .hero p { color: white; font-size: 1.2rem; opacity: 0.9; margin-bottom: 35px; max-width: 500px; }

        /* MÁQUINA SOBRESALIENDO */
        .hero-image { 
            flex: 0.8; 
            position: relative; 
            z-index: 20; 
        }
        .vending-machine {
            width: 130%; /* Tamaño mucho más grande */
            max-width: 650px;
            position: absolute;
            top: -100px; /* Sobresale hacia arriba */
            right: -50px; /* Sobresale hacia la derecha */
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.4));
        }

        .btn-main {
            display: inline-block;
            background: var(--logo-yellow);
            color: var(--logo-blue);
            padding: 18px 30px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 800;
            font-family: 'Montserrat';
            font-size: 1.1rem;
            transition: 0.3s;
        }

        /* --- FOOTER DISCRETO --- */
        .legal-footer {
            padding: 40px 8%;
            background: var(--white);
            color: #666;
            text-align: center;
            font-size: 0.8rem;
        }

        @media (max-width: 1024px) {
            .hero { flex-direction: column; text-align: center; margin-top: 150px; padding-bottom: 300px; }
            .main-logo { left: 50%; transform: translateX(-50%); width: 280px; }
            .vending-machine { position: relative; top: 50px; right: 0; width: 100%; }
            .hero-text-box { margin-top: 120px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="https://wa.me/528114902533" class="btn-nav" target="_blank">Contacto</a>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <img src="logo.png" alt="Rico Snack Logo" class="main-logo">
            
            <div class="hero-text-box">
                <h1>El <span>Sabor</span> que tu Empresa Merece</h1>
                <p>Soluciones de vending premium en Monterrey con tecnología sin contacto y un catálogo curado de snacks.</p>
                <a href="https://wa.me/528114902533" class="btn-main" target="_blank">Agenda una Demostración</a>
            </div>
        </div>

        <div class="hero-image">
            <img src="vending.png" alt="Máquina Vending Rico Snack" class="vending-machine">
        </div>
    </section>

    <footer class="legal-footer">
        <p>&copy; 2026 RICO SNACK - VENDING SOLUTIONS</p>
        <p style="margin-top:10px; opacity:0.6;">Operado legalmente por: [TU NOMBRE COMPLETO]</p>
    </footer>

</body>
</html>
